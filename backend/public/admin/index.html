<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дэлгүүрийн удирдлага</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1E2A44; --muted: #5B6680; --bg: #F3F6FA; --surface: #FFFFFF;
    --line: #DCE3EE; --sun: #FFC93C; --sun-ink: #4A3600;
    --ok: #1F8A5B; --warn: #B4521A; --off: #8A93A6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #E8EDF6; --muted: #A2ACC0; --bg: #121826; --surface: #1B2334;
      --line: #2C3750; --sun: #FFC93C; --sun-ink: #2A1F00;
      --ok: #4FD69C; --warn: #FF9B5E; --off: #7D869A;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Nunito, system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.45; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 1.15rem; font-weight: 800; margin: 0; flex: 1; }
  .mode { font-size: .8rem; padding: 3px 10px; border-radius: 999px; background: var(--sun); color: var(--sun-ink); font-weight: 700; }
  .mode.qpay, .mode.quickqr { background: var(--ok); color: #fff; }
  nav { display: flex; gap: 4px; padding: 12px 20px 0; max-width: 960px; margin: 0 auto; }
  nav button { border: 0; background: none; font: inherit; font-weight: 700; color: var(--muted); padding: 8px 14px; border-radius: 10px 10px 0 0; cursor: pointer; }
  nav button[aria-selected="true"] { background: var(--surface); color: var(--ink); }
  main { max-width: 960px; margin: 0 auto; padding: 0 20px 60px; }
  .panel { background: var(--surface); border-radius: 0 14px 14px 14px; padding: 16px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  select, input, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  textarea { width: 100%; min-height: 70px; }
  button.btn { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 8px 14px; cursor: pointer; background: var(--ink); color: var(--surface); }
  button.btn.sun { background: var(--sun); color: var(--sun-ink); }
  button.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .order { border-top: 1px solid var(--line); padding: 12px 2px; }
  .order:first-child { border-top: 0; }
  .order-head { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
  .order-id { font-weight: 800; }
  .total { font-weight: 800; font-size: 1.05rem; text-align: right; }
  .meta { color: var(--muted); font-size: .9rem; }
  .pill { display: inline-block; font-size: .78rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; }
  .pill.PAID { color: var(--ok); } .pill.PENDING { color: var(--warn); }
  details summary { cursor: pointer; color: var(--muted); font-size: .9rem; margin-top: 6px; }
  .addr { white-space: pre-line; margin: 8px 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: .85rem; border-top: 0; }
  td input { width: 100%; }
  .emoji { font-size: 1.6rem; }
  .login { max-width: 380px; margin: 12vh auto; background: var(--surface); padding: 24px; border-radius: 16px; }
  .login h2 { margin-top: 0; }
  .login input { width: 100%; margin: 8px 0 14px; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 12px; font-weight: 700; display: none; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 10px; }
  .form-grid label { display: flex; flex-direction: column; font-size: .85rem; color: var(--muted); gap: 4px; }
  @media (max-width: 640px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const FULFILL = { NEW: 'Шинэ', PREPARING: 'Бэлтгэж байна', SHIPPING: 'Хүргэлтэнд гарсан', DELIVERED: 'Хүргэгдсэн', CANCELLED: 'Цуцалсан' };
const MODE = { mock: 'Туршилтын төлбөр', manual: 'Дансаар шилжүүлэх', qpay: 'QPay', quickqr: 'QPay Quick QR', points: 'Оноогоор' };
let key = localStorage.getItem('adminKey') || '';
let tab = 'orders', filter = 'PAID_NEW', orders = [], products = [], info = null, editing = null, settings = null, pendingImage = null, qrPending = null, customers = [], emailLog = [];

const $app = document.getElementById('app');
const fmt = (n) => Number(n).toLocaleString('en-US') + '₮';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = (ms) => new Date(ms).toLocaleString('mn-MN', { dateStyle: 'short', timeStyle: 'short' });

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 2200);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'x-admin-key': key, ...(opts.headers || {}) },
  });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401) { key = ''; localStorage.removeItem('adminKey'); render(); throw new Error(body.error || 'Нэвтрэх шаардлагатай'); }
  if (!res.ok) throw new Error(body.error || 'Алдаа гарлаа');
  return body;
}

function renderLogin(err = '') {
  $app.innerHTML = `
    <form class="login" id="login">
      <h2>Дэлгүүрийн удирдлага</h2>
      <label for="k">Админ түлхүүр</label>
      <input id="k" type="password" autocomplete="current-password" required>
      ${err ? `<p style="color:var(--warn)">${esc(err)}</p>` : ''}
      <button class="btn" style="width:100%">Нэвтрэх</button>
    </form>`;
  document.getElementById('login').onsubmit = async (e) => {
    e.preventDefault();
    key = document.getElementById('k').value.trim();
    try { info = await api('/api/admin/info'); localStorage.setItem('adminKey', key); await load(); }
    catch (er) { renderLogin(er.message); }
  };
}

async function load() {
  [orders, products, settings, customers, emailLog] = await Promise.all([
    api('/api/admin/orders'), api('/api/admin/products'), api('/api/admin/settings'),
    api('/api/admin/customers'), api('/api/admin/emails')]);
  render();
}

function filteredOrders() {
  return orders.filter((o) => {
    if (filter === 'PAID_NEW') return o.status === 'PAID' && (o.fulfillment === 'NEW' || o.fulfillment === 'PREPARING');
    if (filter === 'PENDING') return o.status === 'PENDING';
    if (filter === 'ALL') return true;
    return o.fulfillment === filter;
  });
}

function orderHtml(o) {
  const d = o.delivery || {};
  const items = o.items.map((i) => `${esc(i.name)} × ${i.qty}`).join(', ');
  const addr = [d.district, d.khoroo && `${d.khoroo}-р хороо`, d.address].filter(Boolean).join(', ');
  return `
  <div class="order">
    <div class="order-head">
      <div><span class="order-id">${esc(o.id)}</span>
        <span class="pill ${o.status}">${o.status === 'PAID' ? 'Төлөгдсөн' : 'Төлбөр хүлээж буй'}</span></div>
      <div class="total">${fmt(o.total)}</div>
      <div class="meta">${esc(d.fullName)}, ${esc(d.phone)}${o.customer ? ` (бүртгэлтэй: ${esc(o.customer.email || o.customer.phone)})` : ''}</div>
      <div class="meta">${when(o.createdAt)}</div>
    </div>
    <div class="meta">${items}</div>
    <details>
      <summary>Хаяг, дэлгэрэнгүй</summary>
      <div class="addr">${esc(addr)}${d.note ? '\nТайлбар: ' + esc(d.note) : ''}
И-баримт: ${d.receiptType === 'company' ? 'Байгууллага, РД ' + esc(d.companyRegister) : 'Хувь хүн'}${d.email ? '\nИ-мэйл: ' + esc(d.email) : ''}
Хүргэлт: ${esc(d.deliveryOption?.name || 'Стандарт')}
Бараа ${fmt(o.subtotal)}, хүргэлт ${fmt(o.deliveryFee)}${o.pointsUsed ? `, оноо −${o.pointsUsed}` : ''}${o.pointsEarned ? `, олгосон оноо +${o.pointsEarned}` : ''}, төлбөрийн горим: ${esc(MODE[o.paymentMode] || o.paymentMode)}</div>
    </details>
    <div class="actions">
      ${o.status === 'PENDING' && !['qpay', 'quickqr'].includes(o.paymentMode) && o.fulfillment !== 'CANCELLED'
        ? `<button class="btn sun" data-paid="${esc(o.id)}">Төлбөр орсон гэж батлах</button>` : ''}
      <label class="meta">Хүргэлт:
        <select data-ful="${esc(o.id)}" ${o.fulfillment === 'CANCELLED' ? 'disabled' : ''}>
          ${Object.entries(FULFILL).map(([k, v]) => `<option value="${k}" ${o.fulfillment === k ? 'selected' : ''}>${v}</option>`).join('')}
        </select></label>
      <a class="meta" href="tel:${esc(d.phone)}">Залгах</a>
    </div>
  </div>`;
}

function ordersPanel() {
  const list = filteredOrders();
  const opts = { PAID_NEW: 'Илгээх ёстой', PENDING: 'Төлбөр хүлээж буй', PREPARING: 'Бэлтгэж байна', SHIPPING: 'Хүргэлтэнд', DELIVERED: 'Хүргэгдсэн', CANCELLED: 'Цуцалсан', ALL: 'Бүгд' };
  return `
  <div class="toolbar">
    <select id="filter" aria-label="Шүүлтүүр">${Object.entries(opts).map(([k, v]) => `<option value="${k}" ${filter === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
    <span class="meta">${list.length} захиалга</span>
    <span style="flex:1"></span>
    <button class="btn ghost" id="reload">Шинэчлэх</button>
  </div>
  ${list.length ? list.map(orderHtml).join('') : '<div class="empty">Энэ ангилалд захиалга алга.</div>'}`;
}

function productForm(p) {
  const v = p || { name: '', subtitle: '', sku: '', category: '', ageRange: '', price: '', stock: '', emoji: '🎁', imageUrl: '', description: '', isNew: false, features: [], active: true };
  const img = pendingImage ?? v.imageUrl;
  const feats = (v.features || []).map((f) => `${f.value} | ${f.label}`).join('\n');
  const cats = [...new Set(products.map((x) => x.category).filter(Boolean))];
  return `
  <form id="pform" class="panel" style="border:1px solid var(--line); border-radius:14px; margin-bottom:14px">
    <strong>${p ? 'Бараа засах' : 'Шинэ бараа'}</strong>
    <div style="display:flex; gap:14px; align-items:center; margin:12px 0">
      <div style="width:96px; height:96px; border-radius:12px; background:var(--bg); display:grid; place-items:center; overflow:hidden; flex:none">
        ${img ? `<img src="${esc(img)}" alt="" style="width:100%; height:100%; object-fit:contain">` : `<span class="emoji">${esc(v.emoji)}</span>`}
      </div>
      <div>
        <label class="btn ghost" style="display:inline-block">Зураг сонгох
          <input type="file" id="pimg" accept="image/*" style="display:none"></label>
        ${img ? '<button type="button" class="btn ghost" id="pimgclear">Зураг хасах</button>' : ''}
        <div class="meta" id="pimgstatus" style="margin-top:6px">JPG/PNG. Цагаан эсвэл тунгалаг дэвсгэртэй зураг хамгийн гоё харагдана.</div>
      </div>
    </div>
    <div class="form-grid">
      <label>Нэр<input name="name" value="${esc(v.name)}" required placeholder="Угсардаг Робот"></label>
      <label>Дэд нэр<input name="subtitle" value="${esc(v.subtitle)}" placeholder="Elite Commander (White & Blue)"></label>
      <label>Ангилал<input name="category" value="${esc(v.category)}" list="catlist" placeholder="Робот"></label>
      <label>Барааны код<input name="sku" value="${esc(v.sku)}" placeholder="5T-0001"></label>
      <label>Нас<input name="ageRange" value="${esc(v.ageRange)}" placeholder="3+"></label>
      <label>Үнэ (₮)<input name="price" type="number" min="0" step="1" value="${esc(v.price)}" required></label>
      <label>Үлдэгдэл<input name="stock" type="number" min="0" step="1" value="${esc(v.stock)}" required></label>
      <label>Emoji (зураггүй үед)<input name="emoji" value="${esc(v.emoji)}" maxlength="8"></label>
    </div>
    <datalist id="catlist">${cats.map((c) => `<option value="${esc(c)}">`).join('')}</datalist>
    <label class="meta">Тайлбар<textarea name="description">${esc(v.description)}</textarea></label>
    <label class="meta">Онцлог (мөр бүрд "утга | нэр", ихдээ 4)<textarea name="features" placeholder="683 | Хэсэг&#10;2 | Хэлбэр&#10; | Бат бөх дизайн">${esc(feats)}</textarea></label>
    <label class="meta"><input type="checkbox" name="isNew" ${v.isNew ? 'checked' : ''}> "ШИНЭ" тэмдэг харуулах</label><br>
    <label class="meta"><input type="checkbox" name="pointsEligible" ${v.pointsEligible ? 'checked' : ''}> Оноогоор авч болно</label><br>
    <label class="meta"><input type="checkbox" name="active" ${v.active !== false ? 'checked' : ''}> Апп дээр харуулах</label>
    <div class="actions"><button class="btn">Хадгалах</button><button type="button" class="btn ghost" id="pcancel">Болих</button></div>
  </form>`;
}

// Зургийг хөтөч дээр 1000px хүртэл багасгаж JPEG болгоно
function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 1000, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => reject(new Error('Зургийг уншиж чадсангүй'));
    img.src = URL.createObjectURL(file);
  });
}

const when2 = (ms) => new Date(ms).toLocaleString('mn-MN', { dateStyle: 'short', timeStyle: 'short' });

function customersPanel() {
  if (!customers.length) return '<div class="empty">Бүртгэлтэй хэрэглэгч алга.</div>';
  return `
  <p class="meta">${customers.length} хэрэглэгч. Оноо нэмэх бол эерэг, хасах бол сөрөг тоо оруулна.</p>
  <table>
    <thead><tr><th>И-мэйл</th><th>Нэр, утас</th><th>Оноо</th><th class="hide-sm">Захиалга</th><th></th></tr></thead>
    <tbody>${customers.map((c) => `
      <tr>
        <td style="word-break:break-all">${esc(c.email || '—')}</td>
        <td>${esc(c.name)}<br>${c.phone ? `<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>` : '<span class="meta">утасгүй</span>'}</td>
        <td><strong>${c.points.toLocaleString('en-US')}</strong></td>
        <td class="hide-sm">${c.orderCount}</td>
        <td style="white-space:nowrap">
          <input type="number" step="1" style="width:90px" data-pts-input="${esc(c.id)}" aria-label="Оноо">
          <button class="btn ghost" data-pts="${esc(c.id)}">Хадгалах</button>
          <button class="btn ghost" style="color:var(--warn)" data-del="${esc(c.id)}" data-del-name="${esc(c.email || c.phone)}">Устгах</button>
        </td>
      </tr>`).join('')}</tbody>
  </table>`;
}

function emailPanel() {
  const test = info?.email === 'test';
  return `
  ${test ? `<p style="background:var(--sun); color:var(--sun-ink); padding:10px 12px; border-radius:10px; font-weight:700">
    Туршилтын горим: имэйл бодитоор илгээгдэхгүй. Хэрэглэгчийн нэвтрэх кодыг эндээс харна уу.
    Brevo-д бүртгүүлсний дараа Render дээр EMAIL_PROVIDER-ийг солино.</p>` : ''}
  ${emailLog.length ? `<table>
    <thead><tr><th>Цаг</th><th>Хүлээн авагч</th><th>Агуулга</th><th class="hide-sm">Төлөв</th></tr></thead>
    <tbody>${emailLog.map((m) => `
      <tr><td class="meta" style="white-space:nowrap">${when2(m.createdAt)}</td><td style="word-break:break-all">${esc(m.to)}</td>
        <td><strong>${esc(m.subject)}</strong><br><span class="meta" style="white-space:pre-line">${esc(m.text)}</span></td>
        <td class="hide-sm meta">${m.status === 'sent' ? 'Илгээсэн' : m.status === 'failed' ? 'Алдаа' : 'Туршилт'}</td></tr>`).join('')}
    </tbody></table>` : '<div class="empty">Имэйл алга.</div>'}`;
}

// ---------- QPay Quick QR ----------
let qqCities = null, qqDistricts = [], qqType = 'person', qqMsg = '';
const pickCode = (o) => { const k = Object.keys(o).find((x) => /code/i.test(x)); return k ? o[k] : (o.id ?? ''); };
const pickName = (o) => { const k = Object.keys(o).find((x) => /name/i.test(x)); return k ? o[k] : pickCode(o); };
const asList = (d) => Array.isArray(d) ? d : (d?.rows ?? d?.data ?? d?.items ?? []);

function qpayPanel() {
  const s = settings || {};
  const opt = (list, sel) => list.map((o) => `<option value="${esc(pickCode(o))}" ${String(pickCode(o)) === String(sel ?? '') ? 'selected' : ''}>${esc(pickName(o))}</option>`).join('');
  const f = (name, label, ph = '') => `<label>${label}<input name="${name}" placeholder="${esc(ph)}" required></label>`;
  return `
  <strong>QPay Quick QR мерчант</strong>
  <p class="meta">Render дээр QQ_USERNAME, QQ_PASSWORD, QQ_TERMINAL_ID тохируулсан байх шаардлагатай. Мерчантын id нь QR нэхэмжлэх үүсгэхэд ашиглагдана.</p>
  <form id="qqidform" class="actions" style="margin-bottom:18px">
    <label class="meta">Мерчантын id <input name="qqMerchantId" value="${esc(s.qqMerchantId)}" style="min-width:260px"></label>
    <button class="btn">Хадгалах</button>
    <button type="button" class="btn ghost" id="qqcheck">Шалгах</button>
    <button type="button" class="btn ghost" id="qqlist">QPay дээрх мерчантууд</button>
  </form>
  <div id="qqout" class="meta" style="white-space:pre-wrap; margin-bottom:14px">${esc(qqMsg)}</div>
  <form id="qqform" class="panel" style="border:1px solid var(--line); border-radius:14px">
    <strong>Шинээр бүртгүүлэх</strong>
    <div class="actions" style="margin:8px 0">
      <label class="meta"><input type="radio" name="type" value="person" ${qqType === 'person' ? 'checked' : ''}> Хувь хүн</label>
      <label class="meta"><input type="radio" name="type" value="company" ${qqType === 'company' ? 'checked' : ''}> Байгууллага</label>
    </div>
    <div class="form-grid">
      ${qqType === 'person'
        ? f('register_number', 'Регистрийн дугаар', 'УБ99112233') + f('last_name', 'Овог') + f('first_name', 'Нэр')
        : f('name', 'Байгууллагын нэр') + f('register_number', 'Байгууллагын регистр', '1234567')
          + f('owner_register_no', 'Эзэмшигчийн регистр') + f('owner_last_name', 'Эзэмшигчийн овог') + f('owner_first_name', 'Эзэмшигчийн нэр')}
      ${f('phone', 'Утас', '99112233')}${f('email', 'И-мэйл')}
      <label>MCC код<input name="mcc_code" value="5945"></label>
      <label>Хот / аймаг
        <select name="city" id="qqcity" required>${qqCities ? '<option value="">Сонгоно уу</option>' + opt(qqCities) : '<option value="">Ачаалж байна...</option>'}</select></label>
      <label>Сум / дүүрэг
        <select name="district" required>${qqDistricts.length ? opt(qqDistricts) : '<option value="">Эхлээд хот сонгоно</option>'}</select></label>
    </div>
    <label class="meta">Хаяг<textarea name="address" required></textarea></label>
    <div class="actions"><button class="btn sun">QPay-д бүртгүүлэх</button></div>
  </form>`;
}

async function loadQqCities() {
  try { qqCities = asList(await api('/api/admin/quickqr/cities')); }
  catch (er) { qqCities = []; qqMsg = 'Хот/аймгийн жагсаалт авч чадсангүй: ' + er.message; }
  render();
}

function settingsPanel() {
  const s = settings || { deliveryOptions: [] };
  const rows = [...s.deliveryOptions];
  while (rows.length < 3) rows.push({ id: '', name: '', eta: '', fee: 0, active: false });
  return `
  <form id="sform">
    <strong>Хүргэлтийн сонголтууд</strong>
    <p class="meta">Хэрэглэгч захиалга өгөхдөө эдгээрээс сонгоно. Үнийг 0 гэвэл "Үнэгүй" гэж харагдана.</p>
    <table>
      <thead><tr><th>Нэр</th><th>Хугацаа</th><th>Үнэ (₮)</th><th>Идэвхтэй</th></tr></thead>
      <tbody>${rows.map((o, i) => `
        <tr data-opt="${i}" data-id="${esc(o.id)}">
          <td><input name="name" value="${esc(o.name)}" placeholder="Стандарт хүргэлт"></td>
          <td><input name="eta" value="${esc(o.eta)}" placeholder="1-2 өдөр"></td>
          <td><input name="fee" type="number" min="0" step="100" value="${esc(o.fee)}"></td>
          <td><input name="active" type="checkbox" ${o.active !== false && o.name ? 'checked' : ''}></td>
        </tr>`).join('')}</tbody>
    </table>
    <div class="form-grid" style="margin-top:14px">
      <label>Стандарт хүргэлт үнэгүй болох дүн (₮, 0 = хэзээ ч үгүй)<input name="freeDeliveryFrom" type="number" min="0" step="1000" value="${esc(s.freeDeliveryFrom ?? 0)}"></label>
      <label>Дэлгүүрийн утас ("Асуух" товч)<input name="shopPhone" value="${esc(s.shopPhone)}" placeholder="99112233"></label>
      <label>Ажлын цаг<input name="workHours" value="${esc(s.workHours)}" placeholder="Даваа-Ням 10:00-20:00"></label>
    </div>
    <label class="meta">Дэлгүүрийн хаяг<textarea name="shopAddress">${esc(s.shopAddress)}</textarea></label>
    <strong style="display:block; margin-top:18px">Төлбөр хүлээн авах данс</strong>
    <p class="meta">Хэрэглэгч дансаар шилжүүлэх үед апп дээр харагдана. Хоосон бол Render-ийн BANK_* утгыг ашиглана.</p>
    <div class="form-grid" style="margin-top:10px">
      <label>Банк<input name="bankName" value="${esc(s.bankName)}" placeholder="Хаан банк"></label>
      <label>Дансны дугаар<input name="bankAccount" value="${esc(s.bankAccount)}"></label>
      <label>Хүлээн авагчийн нэр<input name="bankAccountHolder" value="${esc(s.bankAccountHolder)}"></label>
    </div>
    <div style="display:flex; gap:14px; align-items:center; margin:10px 0">
      <div style="width:120px; height:120px; border-radius:12px; background:var(--bg); display:grid; place-items:center; overflow:hidden; flex:none">
        ${qrPending ?? s.paymentQrUrl ? `<img src="${esc(qrPending ?? s.paymentQrUrl)}" alt="Төлбөрийн QR" style="width:100%;height:100%;object-fit:contain;background:#fff">` : '<span class="meta">QR алга</span>'}
      </div>
      <div>
        <label class="btn ghost" style="display:inline-block">QR зураг сонгох
          <input type="file" id="qrimg" accept="image/*" style="display:none"></label>
        ${(qrPending ?? s.paymentQrUrl) ? '<button type="button" class="btn ghost" id="qrclear">Хасах</button>' : ''}
        <div class="meta" id="qrstatus" style="margin-top:6px">Банкны аппаасаа дансныхаа QR кодыг (жишээ нь "Миний QR") screenshot хийж оруулна.<br>Хадгалах товч дарахыг мартуузай.</div>
      </div>
    </div>
    <strong style="display:block; margin-top:18px">Оноо</strong>
    <div class="form-grid" style="margin-top:10px">
      <label>Хэдэн ₮ тутамд 1 оноо<input name="pointsPerAmount" type="number" min="1" value="${esc(s.pointsPerAmount ?? 1000)}"></label>
      <label>1 оноо = хэдэн ₮<input name="pointValue" type="number" min="1" value="${esc(s.pointValue ?? 1)}"></label>
      <label>Барааны дүнгийн хэдэн %-ийг оноогоор төлж болох<input name="pointsMaxPercent" type="number" min="0" max="100" value="${esc(s.pointsMaxPercent ?? 100)}"></label>
    </div>
    <strong style="display:block; margin-top:18px">Имэйл</strong>
    <div class="form-grid" style="margin-top:10px">
      <label>Имэйлд гарах дэлгүүрийн нэр<input name="shopName" value="${esc(s.shopName ?? 'F5 Toys')}" maxlength="30"></label>
    </div>
    <label class="meta"><input type="checkbox" name="emailOnStatus" ${s.emailOnStatus !== false ? 'checked' : ''}> Захиалгын төлөв солигдоход хэрэглэгчид имэйл илгээх (төлбөр, хүргэлт, цуцлалт)</label>
    <div class="actions"><button class="btn">Тохиргоо хадгалах</button></div>
    <p class="meta">Өөрчлөлт апп дээр шууд харагдана, апп дахин суулгах шаардлагагүй.</p>
  </form>`;
}

function productsPanel() {
  return `
  ${editing !== null ? productForm(editing === 'new' ? null : products.find((p) => p.id === editing)) : `
  <div class="toolbar"><button class="btn sun" id="padd">Бараа нэмэх</button></div>`}
  <table>
    <thead><tr><th></th><th>Нэр</th><th class="hide-sm">Ангилал</th><th>Үнэ</th><th>Үлдэгдэл</th><th></th></tr></thead>
    <tbody>${products.map((p) => `
      <tr style="${p.active === false ? 'opacity:.5' : ''}">
        <td class="emoji">${p.imageUrl ? `<img src="${esc(p.imageUrl)}" alt="" style="width:40px;height:40px;object-fit:contain;border-radius:8px">` : esc(p.emoji)}</td>
        <td>${esc(p.name)}${p.pointsEligible ? ' <span class="pill PAID">оноо</span>' : ''}</td>
        <td class="hide-sm meta">${esc(p.category)}</td>
        <td>${fmt(p.price)}</td>
        <td style="${p.stock === 0 ? 'color:var(--warn);font-weight:700' : ''}">${p.stock}</td>
        <td><button class="btn ghost" data-edit="${esc(p.id)}">Засах</button></td>
      </tr>`).join('')}</tbody>
  </table>`;
}

function render() {
  if (!key) return renderLogin();
  $app.innerHTML = `
    <header><h1>Тоглоомын дэлгүүр</h1>
      ${info ? `<span class="mode ${info.paymentMode}">${MODE[info.paymentMode] || info.paymentMode}</span>` : ''}
      ${info?.email === 'test' ? '<span class="mode">Имэйл туршилт</span>' : ''}
      <button class="btn ghost" id="logout">Гарах</button></header>
    <nav role="tablist">
      <button role="tab" aria-selected="${tab === 'orders'}" data-tab="orders">Захиалга</button>
      <button role="tab" aria-selected="${tab === 'products'}" data-tab="products">Бараа</button>
      <button role="tab" aria-selected="${tab === 'customers'}" data-tab="customers">Хэрэглэгч</button>
      <button role="tab" aria-selected="${tab === 'email'}" data-tab="email">Имэйл</button>
      <button role="tab" aria-selected="${tab === 'settings'}" data-tab="settings">Тохиргоо</button>
      <button role="tab" aria-selected="${tab === 'qpay'}" data-tab="qpay">QPay</button>
    </nav>
    <main><div class="panel">${({ orders: ordersPanel, products: productsPanel, customers: customersPanel, email: emailPanel, settings: settingsPanel, qpay: qpayPanel })[tab]()}</div></main>`;
  bind();
}

// Зураг солиход маягтад бичсэн утгууд арилахгүй байлгах
function keepForm() {
  const f = document.getElementById('pform');
  const vals = f ? Object.fromEntries([...f.elements].filter((x) => x.name).map((x) => [x.name, x.type === 'checkbox' ? x.checked : x.value])) : {};
  render();
  const g = document.getElementById('pform');
  if (!g) return;
  for (const [k, v] of Object.entries(vals)) {
    const el = g.elements[k];
    if (!el) continue;
    if (el.type === 'checkbox') el.checked = v; else el.value = v;
  }
}

function keepSettingsForm() {
  const f = document.getElementById('sform');
  const vals = f ? [...f.querySelectorAll('input, textarea')].filter((x) => x.type !== 'file').map((x) => [x, x.type === 'checkbox' ? x.checked : x.value]) : [];
  const idx = vals.map(([x]) => [...f.querySelectorAll('input, textarea')].indexOf(x));
  render();
  const g = document.getElementById('sform');
  if (!g) return;
  const all = [...g.querySelectorAll('input, textarea')];
  vals.forEach(([x, v], i) => { const el = all[idx[i]]; if (!el || el.type === 'file') return; if (el.type === 'checkbox') el.checked = v; else el.value = v; });
}

function bind() {
  document.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => {
    tab = b.dataset.tab; editing = null; render();
    if (tab === 'qpay' && qqCities === null) loadQqCities();
  }));
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el[ev] = fn; };
  on('qqidform', 'onsubmit', async (e) => {
    e.preventDefault();
    try {
      await api('/api/admin/settings', { method: 'PUT', body: JSON.stringify({ ...settings, qqMerchantId: e.target.qqMerchantId.value.trim() }) });
      await load(); toast('Мерчантын id хадгалагдлаа');
    } catch (er) { toast(er.message); }
  });
  on('qqcheck', 'onclick', async () => {
    const id = document.querySelector('#qqidform [name=qqMerchantId]').value.trim();
    if (!id) return toast('Мерчантын id оруулна уу');
    qqMsg = 'Шалгаж байна...'; render();
    try {
      const m = await api(`/api/admin/quickqr/merchant/${encodeURIComponent(id)}`);
      const name = m.name || [m.last_name, m.first_name].filter(Boolean).join(' ') || '—';
      qqMsg = `✅ Зөв байна. QPay дээр бүртгэлтэй мерчант:\n`
        + `Нэр: ${name}\nРегистр: ${m.register_number || '—'}\nТөрөл: ${m.type || '—'}\n`
        + `Утас: ${m.phone || '—'}\nИ-мэйл: ${m.email || '—'}`;
    } catch (er) {
      qqMsg = /404|not.?found|олдсонгүй/i.test(er.message)
        ? '❌ Энэ id-тай мерчант QPay дээр олдсонгүй. Id-гаа шалгана уу.\n\n' + er.message
        : /401|403|token/i.test(er.message)
          ? '⚠️ QPay-д нэвтэрч чадсангүй. Render дээрх QQ_USERNAME, QQ_PASSWORD, QQ_TERMINAL_ID, QQ_BASE_URL-ийг шалгана уу.\n\n' + er.message
          : '⚠️ Шалгаж чадсангүй:\n' + er.message;
    }
    const keep = id; render();
    document.querySelector('#qqidform [name=qqMerchantId]').value = keep;
  });
  on('qqlist', 'onclick', async () => {
    try { qqMsg = JSON.stringify(await api('/api/admin/quickqr/merchants'), null, 2); }
    catch (er) { qqMsg = 'Алдаа: ' + er.message; }
    render();
  });
  document.querySelectorAll('#qqform [name=type]').forEach((r) => (r.onchange = () => { qqType = r.value; render(); }));
  on('qqcity', 'onchange', async (e) => {
    const code = e.target.value;
    qqDistricts = [];
    if (code) {
      try { qqDistricts = asList(await api(`/api/admin/quickqr/districts/${encodeURIComponent(code)}`)); }
      catch (er) { toast(er.message); }
    }
    const f = document.getElementById('qqform');
    const vals = Object.fromEntries([...new FormData(f).entries()]);
    render();
    const g = document.getElementById('qqform');
    for (const [k, v] of Object.entries(vals)) { const el = g.elements[k]; if (el && el.type !== 'radio') el.value = v; }
  });
  on('qqform', 'onsubmit', async (e) => {
    e.preventDefault();
    const body = Object.fromEntries([...new FormData(e.target).entries()]);
    if (!confirm('Эдгээр мэдээллээр QPay-д мерчант бүртгүүлэх үү?')) return;
    try {
      const m = await api('/api/admin/quickqr/merchant', { method: 'POST', body: JSON.stringify(body) });
      qqMsg = `Амжилттай! Мерчантын id: ${m.id}\n\n` + JSON.stringify(m, null, 2);
      await load(); toast('Мерчант бүртгэгдлээ');
    } catch (er) { qqMsg = 'Алдаа: ' + er.message; render(); }
  });
  on('logout', 'onclick', () => { key = ''; localStorage.removeItem('adminKey'); render(); });
  on('filter', 'onchange', (e) => { filter = e.target.value; render(); });
  on('reload', 'onclick', () => load().then(() => toast('Шинэчлэгдлээ')).catch((e) => toast(e.message)));
  on('padd', 'onclick', () => { editing = 'new'; pendingImage = null; render(); });
  on('pcancel', 'onclick', () => { editing = null; pendingImage = null; render(); });
  on('pimgclear', 'onclick', () => { pendingImage = ''; keepForm(); });
  on('pimg', 'onchange', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const st = document.getElementById('pimgstatus');
    try {
      st.textContent = 'Зураг байршуулж байна...';
      const dataUrl = await resizeImage(file);
      const r = await api('/api/admin/images', { method: 'POST', body: JSON.stringify({ dataUrl }) });
      pendingImage = r.url;
      keepForm();
      toast('Зураг нэмэгдлээ');
    } catch (er) { st.textContent = er.message; }
  });
  // QR зургийг шахахгүй (уншигдахаа болихоос сэргийлж PNG-ээр хадгална)
  on('qrimg', 'onchange', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const st = document.getElementById('qrstatus');
    try {
      if (file.size > 3 * 1024 * 1024) throw new Error('Зураг 3MB-аас бага байх ёстой');
      st.textContent = 'Байршуулж байна...';
      const dataUrl = await new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = bad; r.readAsDataURL(file); });
      const r = await api('/api/admin/images', { method: 'POST', body: JSON.stringify({ dataUrl }) });
      qrPending = r.url; keepSettingsForm(); toast('QR нэмэгдлээ. "Тохиргоо хадгалах" дарна уу.');
    } catch (er) { st.textContent = er.message; }
  });
  on('qrclear', 'onclick', () => { qrPending = ''; keepSettingsForm(); });
  on('sform', 'onsubmit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const deliveryOptions = [...f.querySelectorAll('[data-opt]')].map((tr, i) => ({
      id: tr.dataset.id || ['standard', 'fast', 'urgent'][i] || `opt${i}`,
      name: tr.querySelector('[name=name]').value.trim(),
      eta: tr.querySelector('[name=eta]').value.trim(),
      fee: Number(tr.querySelector('[name=fee]').value || 0),
      active: tr.querySelector('[name=active]').checked,
    })).filter((o) => o.name);
    const body = {
      deliveryOptions,
      freeDeliveryFrom: Number(f.freeDeliveryFrom.value || 0),
      shopPhone: f.shopPhone.value.trim(), workHours: f.workHours.value.trim(), shopAddress: f.shopAddress.value.trim(),
      pointsPerAmount: Number(f.pointsPerAmount.value || 1000), pointValue: Number(f.pointValue.value || 1),
      pointsMaxPercent: Number(f.pointsMaxPercent.value || 0), shopName: f.shopName.value.trim(),
      emailOnStatus: f.emailOnStatus.checked,
      bankName: f.bankName.value.trim(), bankAccount: f.bankAccount.value.trim(),
      bankAccountHolder: f.bankAccountHolder.value.trim(),
      paymentQrUrl: qrPending ?? settings.paymentQrUrl ?? '',
      qqMerchantId: settings.qqMerchantId ?? '',
    };
    try { await api('/api/admin/settings', { method: 'PUT', body: JSON.stringify(body) }); qrPending = null; await load(); toast('Тохиргоо хадгалагдлаа'); }
    catch (er) { toast(er.message); }
  });
  on('pform', 'onsubmit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const body = Object.fromEntries(f.entries());
    body.price = Number(body.price); body.stock = Number(body.stock);
    body.active = f.has('active'); body.isNew = f.has('isNew'); body.pointsEligible = f.has('pointsEligible');
    body.features = String(body.features || '').split('\n').map((l) => l.split('|'))
      .map(([a, b]) => ({ value: (b === undefined ? '' : a).trim(), label: (b === undefined ? a : b).trim() }))
      .filter((x) => x.value || x.label);
    const current = products.find((x) => x.id === editing);
    body.imageUrl = pendingImage ?? current?.imageUrl ?? '';
    try {
      await api(`/api/admin/products/${encodeURIComponent(editing)}`, { method: 'PUT', body: JSON.stringify(body) });
      editing = null; pendingImage = null; await load(); toast('Хадгалагдлаа');
    } catch (er) { toast(er.message); }
  });
  document.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = () => { editing = b.dataset.edit; pendingImage = null; render(); window.scrollTo(0, 0); }));
  document.querySelectorAll('[data-paid]').forEach((b) => (b.onclick = async () => {
    if (!confirm(`${b.dataset.paid} захиалгын төлбөр данс руу орсныг шалгасан уу?`)) return;
    try { await api(`/api/admin/orders/${encodeURIComponent(b.dataset.paid)}/mark-paid`, { method: 'POST' }); await load(); toast('Төлөгдсөн болголоо'); }
    catch (er) { toast(er.message); }
  }));
  document.querySelectorAll('[data-del]').forEach((b) => (b.onclick = async () => {
    if (!confirm(`${b.dataset.delName} хэрэглэгчийг устгах уу?\n\nОноо, мессеж нь бүрмөсөн устна. Захиалгууд нь дэлгүүрийн бүртгэлд хадгалагдана. Буцаах боломжгүй.`)) return;
    try { await api(`/api/admin/customers/${encodeURIComponent(b.dataset.del)}`, { method: 'DELETE' }); await load(); toast('Хэрэглэгч устгагдлаа'); }
    catch (er) { toast(er.message); }
  }));
  document.querySelectorAll('[data-pts]').forEach((b) => (b.onclick = async () => {
    const id = b.dataset.pts;
    const delta = Number(document.querySelector(`[data-pts-input="${id}"]`).value || 0);
    if (!delta) return toast('Оноо оруулна уу');
    const reason = prompt('Шалтгаан (хэрэглэгчид харагдана):', delta > 0 ? 'Урамшуулал' : 'Засвар');
    if (reason === null) return;
    try { await api(`/api/admin/customers/${encodeURIComponent(id)}/points`, { method: 'POST', body: JSON.stringify({ delta, reason }) }); await load(); toast('Оноо шинэчлэгдлээ'); }
    catch (er) { toast(er.message); }
  }));
  document.querySelectorAll('[data-ful]').forEach((s) => (s.onchange = async () => {
    if (s.value === 'CANCELLED' && !confirm('Захиалгыг цуцлах уу? Ашигласан оноо буцаагдаж, олгосон оноо хасагдана.')) { render(); return; }
    try { await api(`/api/admin/orders/${encodeURIComponent(s.dataset.ful)}`, { method: 'PATCH', body: JSON.stringify({ fulfillment: s.value }) }); await load(); toast('Төлөв шинэчлэгдлээ'); }
    catch (er) { toast(er.message); }
  }));
}

(async () => {
  if (!key) return render();
  try { info = await api('/api/admin/info'); await load(); } catch { render(); }
})();
setInterval(() => { if (key && tab === 'orders' && editing === null) load().catch(() => {}); }, 60000);
</script>
</body>
</html>
